name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Build & deploy React frontend to Azure Static Web Apps ──────────────
  deploy-frontend:
    name: Frontend → Azure Static Web Apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React app
        working-directory: frontend
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend
          output_location: build
          skip_app_build: true   # we already built above

  # ── Deploy Laravel backend to Azure App Service ─────────────────────────
  deploy-backend:
    name: Backend → Azure App Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo_mysql

      - name: Install Composer dependencies (no dev)
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_APP_SERVICE_NAME }}
          publish-profile: ${{ secrets.AZURE_APP_SERVICE_PUBLISH_PROFILE }}
          package: backend

# ── GitHub Secrets required ──────────────────────────────────────────────────
# REACT_APP_API_URL                  → https://your-api.azurewebsites.net
# AZURE_STATIC_WEB_APPS_API_TOKEN   → from Azure portal → Static Web App → Manage token
# AZURE_APP_SERVICE_NAME            → name of your App Service
# AZURE_APP_SERVICE_PUBLISH_PROFILE → download from Azure portal → App Service → Get publish profile
